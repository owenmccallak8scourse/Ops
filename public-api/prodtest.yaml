apiVersion: v1
kind: Namespace
metadata:
  annotations:
    note: Este es el ambiente de Producion
  labels:
    app: public-api
    team: devops
  name: public
---
apiVersion: v1
data:
  PRIVATE_API: PROD_ENDPOINT
kind: ConfigMap
metadata:
  annotations:
    note: Este es el ambiente de Producion
  labels:
    app: public-api
    team: devops
  name: cm-private-api
  namespace: public
---
apiVersion: v1
data:
  .dockerconfigjson: 
kind: Secret
metadata:
  annotations:
    note: Este es el ambiente de Producion
  labels:
    app: public-api
    team: devops
  name: regcred
  namespace: public
type: kubernetes.io/dockerconfigjson
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    note: Este es el ambiente de Producion
  labels:
    app: public-api
    team: devops
  name: public-api
  namespace: public
spec:
  ports:
  - name: public-api
    port: 3000
    protocol: TCP
    targetPort: 3000
  selector:
    app: public-api
    team: devops
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    note: Este es el ambiente de Producion
  labels:
    app: public-api
    team: devops
  name: public-api
  namespace: public
spec:
  selector:
    matchLabels:
      app: public-api
      team: devops
  template:
    metadata:
      annotations:
        note: Este es el ambiente de Producion
      labels:
        app: public-api
        team: devops
      name: public-api
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: cm-private-api
        image: owen1710/kubelabs_publicapi:1.0.0
        imagePullPolicy: Always
        name: public-api
        ports:
        - containerPort: 3000
          name: public-api
        resources:
          limits:
            cpu: 20m
            memory: 200Mi
          requests:
            cpu: 10m
            memory: 50Mi
      imagePullSecrets:
      - name: regcred
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    note: Este es el ambiente de Producion
  labels:
    app: public-api
    team: devops
  name: public-api
  namespace: public
spec:
  rules:
  - host: api.owen.kubelabs.dev
    http:
      paths:
      - backend:
          service:
            name: public-api
            port:
              number: 3000
        path: /
        pathType: Prefix
      - backend:
          service:
            name: public-api
            port:
              number: 3000
        path: /graphql
        pathType: Prefix
